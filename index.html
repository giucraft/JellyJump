function makeObstacle(l,z,kind='log'){
 const g=new THREE.Group();
 if(kind==='gap'){const hole=new THREE.Mesh(new THREE.BoxGeometry(2.45,.09,5.2),mat('#287b9a'));hole.position.y=-.13;g.add(hole);const rimMat=mat('#f7dfaa');for(const side of [-1,1]){const rim=new THREE.Mesh(new THREE.BoxGeometry(.13,.16,5.3),rimMat);rim.position.set(side*1.27,-.04,0);g.add(rim)}}else if(kind==='log'){
  const log=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,1.55,12),wood);log.rotation.z=Math.PI/2;log.position.y=.43;log.castShadow=true;g.add(log);
  const cap=mat('#d69a65');for(let s of [-1,1]){const c=new THREE.Mesh(new THREE.CircleGeometry(.32,12),cap);c.rotation.y=s*Math.PI/2;c.position.set(s*.78,.43,0);g.add(c)}
 }else if(kind==='barrier'){
  const beam=new THREE.Mesh(new THREE.BoxGeometry(1.75,.28,.32),mat('#b97848'));beam.position.y=2.02;beam.castShadow=true;g.add(beam);
  for(let s of [-1,1]){const post=new THREE.Mesh(new THREE.BoxGeometry(.16,1.95,.2),mat('#d49a65'));post.position.set(s*.76,1.0,0);post.castShadow=true;g.add(post)}
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.35,.055,.34),mat('#ffe19a'));stripe.position.set(0,2.02,.02);g.add(stripe);
 }else if(kind==='rock'){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.82,1),mat('#8c9a9b'));rock.position.y=.72;rock.scale.set(1,.92,.9);rock.rotation.set(.2,.4,.15);rock.castShadow=true;rock.receiveShadow=true;g.add(rock);
  const highlight=new THREE.Mesh(new THREE.DodecahedronGeometry(.28,0),mat('#b9c5bd'));highlight.position.set(-.28,1.18,.48);highlight.scale.set(1,.45,.35);g.add(highlight);
 }
 g.position.set(l*2,0,z);scene.add(g);objects.push({group:g,type:kind,lane:l,hit:false});
}
function makeGem(l,z){const gemColours=['#ff76a8','#55d9e8','#ffe16b','#a98bff','#78d879','#ffad66'];const colour=gemColours[Math.floor(Math.random()*gemColours.length)];const points=[new THREE.Vector2(0,0),new THREE.Vector2(.25,0),new THREE.Vector2(.36,.055),new THREE.Vector2(.41,.14),new THREE.Vector2(.39,.25),new THREE.Vector2(.32,.37),new THREE.Vector2(.22,.49),new THREE.Vector2(.1,.57),new THREE.Vector2(0,.59)];const shape=new THREE.LatheGeometry(points,32);const candyMat=new THREE.MeshPhysicalMaterial({color:colour,roughness:.2,metalness:0,clearcoat:1,clearcoatRoughness:.12});const g=new THREE.Group();const candy=new THREE.Mesh(shape,candyMat);candy.castShadow=true;g.add(candy);const shineMat=new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.82});const shine=new THREE.Mesh(new THREE.SphereGeometry(.065,12,10),shineMat);shine.scale.set(.8,1.35,.35);shine.position.set(-.13,.4,.29);g.add(shine);g.position.set(l*2,1.2,z);scene.add(g);objects.push({group:g,type:'gem',lane:l,hit:false})}
function spawn(){const l=Math.floor(Math.random()*3)-1;const kinds=currentWave===1?['log','log','barrier','rock']:currentWave===2?['log','barrier','rock','rock']:currentWave===3?['barrier','log','barrier','rock']:currentWave===4?['gap','gap','log','barrier']:['gap','log','rock','barrier'];const kind=kinds[Math.floor(Math.random()*kinds.length)];makeObstacle(l,-58-Math.random()*8,kind);if(Math.random()<.9)makeGem(Math.floor(Math.random()*3)-1,-68)}
function setLane(n){targetLane=Math.max(-1,Math.min(1,targetLane+n))}
function jump(){if(!running)return;if(onGround){vy=9.5;onGround=false;jumpCount=1;effect('jump')}else if(jumpCount===1){vy=9.5;jumpCount=2;effect('jump')}}
function slide(){if(running&&onGround&&slideTimer<=0){slideTimer=.78}}
function move(e){if(e.code==='ArrowLeft'||e.code==='KeyA'){setLane(-1)}else if(e.code==='ArrowRight'||e.code==='KeyD'){setLane(1)}else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();slide()}else if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!running&&!over)start();else jump()}}
document.addEventListener('keydown',move);
let touchX=0,touchY=0;canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;touchY=e.clientY});canvas.addEventListener('pointerup',e=>{if(!running)return;const dx=e.clientX-touchX,dy=e.clientY-touchY;if(Math.abs(dx)>14){setLane(dx>0?1:-1)}else if(dy>16){slide()}else if(dy<-16||Math.abs(dx)<14){jump()}});
function renderBook(){$('cards').innerHTML='';pets.forEach(p=>{const el=document.createElement('div');el.className='pet'+(unlocked.has(p.id)?'':' locked');el.innerHTML='<div class="emoji">'+(unlocked.has(p.id)?p.emoji:'❔')+'</div><b>'+(unlocked.has(p.id)?p.name:'Mystery friend')+'</b><div>'+(unlocked.has(p.id)?'Tap to choose':p.cost+' jelly drops')+'</div>';el.onclick=()=>{if(unlocked.has(p.id)){changePet(p.id);$('book').style.display='none';$('message').textContent=p.name+' is ready to run! ✨'}};$('cards').appendChild(el)})}
function unlock(){for(const p of pets){if(!unlocked.has(p.id)&&drops>=p.cost){unlocked.add(p.id);$('message').textContent='New friend discovered: '+p.name+'! ✨';effect('unlock');renderBook();break}}}
function clearObjects(){objects.forEach(o=>scene.remove(o.group));objects=[]}
function refreshWaveOptions(){document.querySelectorAll('.wave-option').forEach(b=>{const wave=Number(b.dataset.wave);b.disabled=wave>highestWave;b.classList.toggle('selected',wave===selectedWave);b.textContent=(wave===selectedWave?'✓ ':'')+'Wave '+wave+' · '+waveNames[wave-1]+(wave>highestWave?'  🔒':'')})}
function setWave(n){selectedWave=Math.max(1,Math.min(highestWave,Number(n)||1));refreshWaveOptions()}
function buildWaveMenu(){const list=$('waveList');list.innerHTML='';waveNames.forEach((name,i)=>{const n=i+1,b=document.createElement('button');b.type='button';b.className='wave-option';b.dataset.wave=String(n);b.textContent='Wave '+n+' · '+name;b.disabled=n>highestWave;b.onclick=()=>{setWave(n);$('waveStart').textContent='▶ Start Wave '+selectedWave};list.appendChild(b)});refreshWaveOptions()}
function openWaveMenu(){if(running){running=false;stopMusic()}startMenuMusic();setPausedVisual(false);over=false;$('waveModal').style.display='flex';$('controlGuide').style.display='none';buildWaveMenu();$('waveStart').textContent='▶ Start Wave '+selectedWave;}
function announceWave(text){const el=$('waveAnnouncement');el.classList.remove('show');el.textContent=text;void el.offsetWidth;el.classList.add('show')}
function beginWave(n){currentWave=n;highestWave=Math.max(highestWave,n);localStorage.jjHighestWave=String(highestWave);refreshWaveOptions();waveElapsed=0;inBreak=false;breakTimer=0;spawnClock=0;clearObjects();const looks=[["#91d9ff","#79ca83","#e9bd7d"],["#f9c9ed","#9bdc9a","#f4b9d0"],["#b9c8ff","#9eb8e9","#d9d4ff"],["#8bdcf0","#55b9a4","#f5d48d"],["#b7efff","#80d7e8","#f5a5c7"],["#ffe1a8","#9bded0","#e9a9c7"],["#b9b6ef","#8bc7d8","#f0d5a1"],["#8ee7ee","#5ebbc4","#f4d2a0"],["#c5b8ff","#8ba9e8","#f5b8d3"],["#ffd5ad","#b8dca1","#e7a77f"],["#b4e7c5","#83c9a8","#f2d7a4"],["#83d8ee","#5aa9bb","#f6d39c"],["#f4d6f0","#b5c7ee","#e8b7c8"],["#f4d8a6","#c7b58b","#e7b0a0"],["#d8c1ff","#9bd8cf","#f4c5d9"],["#a6e7dc","#65b9b1","#f5d9a3"],["#f7c8e8","#a5d9d0","#eeb2a0"],["#c2c7ff","#91c5ed","#f4c8a5"],["#b5e9f0","#76c8c0","#f5b8d2"],["#d8c5ff","#9edbd1","#f5d49b"]][currentWave-1];scene.background.set(looks[0]);scene.fog.color.set(looks[0]);grass.color.set(looks[1]);path.color.set(looks[2]);announceWave('Wave '+currentWave+' · '+waveNames[currentWave-1]+'!');$('message').textContent='';startMusic()}
function setPausedVisual(on){$('message').classList.toggle('paused-message',on);$('world').classList.toggle('paused-world',on);if(on)$('message').textContent='Paused!'}
function start(){$('waveModal').style.display='none';setPausedVisual(false);$('gameTitle').classList.remove('bam-title');$('gameTitle').style.display='none';clearObjects();score=0;lane=0;targetLane=0;vy=0;onGround=true;jumpCount=0;slideTimer=0;turnClock=0;turnTimer=0;player.rotation.y=0;speed=17;spawnClock=0;gemClock=0;waveElapsed=0;inBreak=false;currentWave=selectedWave;running=true;paused=false;over=false;$('score').textContent='0';$('play').textContent='Ⅱ Pause';$('controlGuide').style.display='none';player.position.set(0,0,3);clock.getDelta();audioReady();beginWave(currentWave)}
function end(){setPausedVisual(false);const collectedThisRun=drops;running=false;over=true;$('gameTitle').style.display='block';$('gameTitle').classList.add('bam-title');stopMusic();startMenuMusic();effect('end');drops=0;$('drops').textContent='0';$('goalCount').textContent='0 / 100';$('goalFill').style.width='0%';$('play').textContent='↻ Play again';$('message').textContent='Lovely run! You collected '+collectedThisRun+' jelly drops. Your friends are safe! 💛';}
function update(dt){if(!running)return;if(inBreak){breakTimer-=dt;if(breakTimer<=0)beginWave(currentWave>=20?1:currentWave+1);return}waveElapsed+=dt;if(waveElapsed>=58){if(currentWave===1)localStorage.jjFinishedWave1='yes';inBreak=true;breakTimer=6;clearObjects();stopMusic();$('message').textContent='☀️ Lovely work! Short break — next wave in a moment!';return}score+=Math.round(dt*30);$('score').textContent=score;speed=Math.min(29,17+score*.004);syncMusicTempo(speed);spawnClock+=dt;gemClock+=dt;if(spawnClock>Math.max(.8,1.55-score*.0005)){spawn();spawnClock=0}
lane+=(targetLane-lane)*Math.min(1,dt*24);player.position.x=lane*2;player.position.y=Math.max(0,player.position.y+vy*dt);if(!onGround){vy-=23*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true;jumpCount=0}}player.rotation.z+=(lane*-.08-player.rotation.z)*dt*7;turnClock+=dt;if(turnClock>=8&&turnTimer<=0){turnClock=0;turnTimer=1.4}if(turnTimer>0)turnTimer=Math.max(0,turnTimer-dt);const faceTarget=turnTimer>.7?0:Math.PI;player.rotation.y+=(faceTarget-player.rotation.y)*Math.min(1,dt*7);
const t=clock.elapsedTime;const bounce=onGround?Math.sin(t*13)*.025:0;if(slideTimer>0)slideTimer=Math.max(0,slideTimer-dt);const ducking=slideTimer>0;const slideBlend=ducking?1:0;player.rotation.x+=(slideBlend*(Math.PI/2)-player.rotation.x)*Math.min(1,dt*18);if(onGround){player.position.y+=( (ducking?.72:bounce)-player.position.y)*Math.min(1,dt*18);}player.position.z+=(3-player.position.z)*Math.min(1,dt*18);player.scale.setScalar(.8);player.userData.feet.forEach((f,i)=>{f.position.z=Math.sin(t*13+i*Math.PI)*.025;f.position.y=.22+Math.max(0,Math.sin(t*13+i*Math.PI))*.025});
for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.group.position.z+=speed*dt;if(o.type==='gem'){o.group.rotation.y+=dt*2.7;o.group.rotation.z+=dt*1.2}
if(!o.hit&&Math.abs(o.group.position.z-3)<(o.type==='gap'?2.7:.85)&&o.lane===Math.round(lane)){
 o.hit=true;
 if(o.type==='gem'){drops++;effect('gem');$('drops').textContent=drops;$('goalCount').textContent=(drops%100)+' / 100';$('goalFill').style.width=(drops%100)+'%';scene.remove(o.group);objects.splice(i,1);unlock();continue}
 const collision=(o.type==='log'&&player.position.y<.85)||(o.type==='barrier'&&!ducking)||(o.type==='rock')||(o.type==='gap'&&player.position.y<2.05);
 if(collision){end();break}
}
if(o.group.position.z>12){scene.remove(o.group);objects.splice(i,1)}}
scenery.forEach(o=>{o.position.z+=speed*dt;if(o.position.z>12)o.position.z=-100-Math.random()*25});clouds.forEach(c=>{c.position.x+=dt*.35;if(c.position.x>19)c.position.x=-19});
camera.position.x+=(lane*.38-camera.position.x)*dt*2;camera.lookAt(lane*.3,1.2,-5)}
