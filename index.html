<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#9cefe6">
<meta name="description" content="A fluffy little jumping adventure.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>JellyJump</title>
<style>
:root{--ink:#36556a;--mint:#baf4e8;--coral:#ffadad;--cream:#fff9e9;--blue:#a9ddff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#c9f4eb}
.app{position:fixed;inset:0;width:100vw;height:100dvh;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;overflow:hidden;text-align:center}
.app h1,.app>.sub,.app>.small{display:none}
.panel{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:0;background:transparent;display:block}
canvas{position:absolute;inset:0;display:block;width:100vw;height:100dvh;max-width:none;max-height:none;border:0;border-radius:0;background:#c9f4eb;touch-action:manipulation}
.stats{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:0;width:100%;display:flex;justify-content:space-around;font-weight:900;font-size:clamp(16px,3vw,22px);padding:9px 8px;color:#36556a;text-shadow:0 1px #fff}
.actions{position:absolute;z-index:3;left:0;width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0;padding:0 8px}
#choices{position:absolute;bottom:max(12px,env(safe-area-inset-bottom))}
#choices button{padding:9px 13px;font-size:clamp(12px,2.7vw,16px)}
#choices button:focus{outline:3px solid #fff}
.panel>.actions:not(#choices){position:absolute;bottom:max(66px,calc(env(safe-area-inset-bottom) + 58px));}
#message{position:absolute;z-index:2;left:0;bottom:116px;width:100%;min-height:24px;margin:0;padding:0 12px;font-weight:900;color:#36556a;text-shadow:0 1px 2px #fff}
button{border:2px solid #fff;border-radius:999px;padding:10px 15px;background:#72d4c5;color:#174e59;font:inherit;font-weight:800;box-shadow:0 3px 0 #49a99f;cursor:pointer}
button.secondary{background:#ffe0a8;box-shadow:0 3px 0 #e9bf79}
button:active{transform:translateY(2px);box-shadow:none}
.collection{display:none;position:absolute;z-index:5;left:5%;right:5%;top:15%;max-height:70%;overflow:auto;text-align:left;margin:0;padding:12px;background:#f7fffcf2;border:2px solid white;border-radius:20px;box-shadow:0 8px 30px #36556a44}
.collection h2{text-align:center;margin:4px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pet{background:white;border-radius:14px;padding:9px;text-align:center;border:2px solid #e3f6ef}
.pet .emoji{font-size:2rem}
.locked{filter:grayscale(1);opacity:.5}
.small{font-size:.82rem;color:#78909c;margin:10px 0 0}
@media (max-height:560px){#choices{bottom:6px}#play,#jump,#collection{bottom:54px}#message{bottom:98px}button{padding:7px 11px}}
</style>
</head>
<body><main class="app">
<h1>JellyJump ✨</h1><p class="sub">A fluffy little jumping adventure!</p>
<section class="panel">
<canvas id="game" width="720" height="460" aria-label="JellyJump game. Tap or press space to jump."></canvas>
<div class="stats"><span>⭐ <b id="score">0</b></span><span>💧 <b id="drops">0</b></span><span>🏆 <b id="best">0</b></span></div>
<div id="message">Choose a fluffy friend and tap Play!</div>
<div class="actions">
<button id="play">▶ Play</button><button id="jump" class="secondary">⬆ Jump</button><button id="collection">📖 Friends</button>
</div>
<div class="actions" id="choices">
<button data-pet="bunny" class="secondary">🐰 Bunny</button><button data-pet="kitten" class="secondary">🐱 Kitten</button><button data-pet="frog" class="secondary">🐸 Frog</button><button data-pet="bear" class="secondary">🐻 Bear</button>
</div>
<div class="collection" id="book"><h2>✨ Friend book</h2><p class="small">Collect jelly drops during runs to discover new friends!</p><div class="cards" id="cards"></div></div>
</section><p class="small">Tip: tap the game, press Jump, or use the space bar.</p>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const pets=[
{id:'bunny',name:'Bunny',emoji:'🐰',color:'#fff0d8',cost:0},
{id:'kitten',name:'Kitten',emoji:'🐱',color:'#d9dce8',cost:0},
{id:'frog',name:'Frog',emoji:'🐸',color:'#bce8b0',cost:0},
{id:'bear',name:'Bear',emoji:'🐻',color:'#d9a879',cost:0},
{id:'fox',name:'Fox',emoji:'🦊',color:'#f6b078',cost:8},
{id:'lamb',name:'Lamb',emoji:'🐑',color:'#fff8ec',cost:16},
{id:'axolotl',name:'Axolotl',emoji:'🩷',color:'#ffc4d8',cost:25},
{id:'penguin',name:'Penguin',emoji:'🐧',color:'#b9d9ee',cost:36},
{id:'dragon',name:'Dragon',emoji:'🐲',color:'#b8b2ed',cost:50},
{id:'unicorn',name:'Unicorn',emoji:'🦄',color:'#f5c9ee',cost:70}
];
let selected='bunny',unlocked=new Set(['bunny','kitten','frog','bear']),running=false,over=false,score=0,drops=0,best=Number(localStorage.jjBest||0),speed=4,frame=0;
let player={x:115,y:320,vy:0,onGround:true},obstacles=[],gems=[];
$('best').textContent=best;
function drawPet(x,y,size,id){
 const p=pets.find(v=>v.id===id)||pets[0], fur=p.color;
 ctx.save();ctx.translate(x,y);ctx.lineJoin='round';
 const oval=(x,y,rx,ry,color,stroke='#fff',lw=4)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}};
 // Feet and arms
 oval(-size*.4,size*.5,size*.25,size*.17,fur);oval(size*.4,size*.5,size*.25,size*.17,fur);
 ctx.strokeStyle=fur;ctx.lineWidth=size*.23;ctx.beginPath();ctx.moveTo(-size*.48,0);ctx.lineTo(-size*.72,size*.24);ctx.moveTo(size*.48,0);ctx.lineTo(size*.72,size*.24);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
 // Distinct ears and head shapes
 if(id==='bunny'){ctx.save();ctx.rotate(-.16);oval(-size*.34,-size*.82,size*.2,size*.53,fur);oval(-size*.34,-size*.82,size*.095,size*.38,'#f4b8c7',null);ctx.restore();ctx.save();ctx.rotate(.16);oval(size*.34,-size*.82,size*.2,size*.53,fur);oval(size*.34,-size*.82,size*.095,size*.38,'#f4b8c7',null);ctx.restore()}
 if(id==='kitten'){ctx.fillStyle=fur;ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-size*.68,-size*.35);ctx.lineTo(-size*.57,-size*.98);ctx.lineTo(-size*.28,-size*.62);ctx.quadraticCurveTo(0,-size*.8,size*.28,-size*.62);ctx.lineTo(size*.57,-size*.98);ctx.lineTo(size*.68,-size*.35);ctx.closePath();ctx.fill();ctx.stroke();oval(-size*.49,-size*.61,size*.07,size*.12,'#efb5c5',null);oval(size*.49,-size*.61,size*.07,size*.12,'#efb5c5',null)}
 if(id==='frog'){oval(-size*.36,-size*.61,size*.22,size*.24,fur);oval(size*.36,-size*.61,size*.22,size*.24,fur);oval(-size*.36,-size*.63,size*.11,size*.13,'#fff',null);oval(size*.36,-size*.63,size*.11,size*.13,'#fff',null)}
 if(id==='bear'){oval(-size*.49,-size*.65,size*.22,size*.22,fur);oval(size*.49,-size*.65,size*.22,size*.22,fur);oval(-size*.49,-size*.65,size*.1,size*.1,'#eaaeb2',null);oval(size*.49,-size*.65,size*.1,size*.1,'#eaaeb2',null)}
 // Plush body and round head
 oval(0,size*.06,size*.69,size*.67,fur);oval(0,-size*.28,size*.67,size*.61,fur);
 if(id==='bunny')oval(0,-size*.01,size*.32,size*.24,'#fff7ed',null);
 if(id==='kitten')oval(0,-size*.01,size*.34,size*.23,'#f0edf4',null);
 if(id==='frog')oval(0,size*.02,size*.39,size*.29,'#d9f3b9',null);
 if(id==='bear')oval(0,-size*.01,size*.34,size*.25,'#f2d2ae',null);
 // Eyes, nose, smile and rosy cheeks
 oval(-size*.23,-size*.34,size*.055,size*.075,'#35495b',null);oval(size*.23,-size*.34,size*.055,size*.075,'#35495b',null);
 oval(-size*.25,-size*.37,size*.018,size*.022,'#fff',null);oval(size*.21,-size*.37,size*.018,size*.022,'#fff',null);
 if(id==='kitten'){ctx.fillStyle='#e99bab';ctx.beginPath();ctx.moveTo(-size*.07,-size*.17);ctx.lineTo(size*.07,-size*.17);ctx.lineTo(0,-size*.09);ctx.fill()}else{oval(0,-size*.15,size*.06,size*.045,id==='frog'?'#5caa68':'#d98f9b',null)}
 ctx.strokeStyle='#536477';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-size*.1);ctx.lineTo(0,-size*.02);ctx.quadraticCurveTo(-size*.12,size*.1,-size*.2,-size*.01);ctx.moveTo(0,-size*.02);ctx.quadraticCurveTo(size*.12,size*.1,size*.2,-size*.01);ctx.stroke();
 oval(-size*.4,-size*.12,size*.1,size*.06,'#f4b5bd',null);oval(size*.4,-size*.12,size*.1,size*.06,'#f4b5bd',null);
 // A few little tufts give the friends a soft plush outline
 ctx.fillStyle=fur;for(let i=0;i<9;i++){const ang=Math.PI+i*Math.PI/8;ctx.beginPath();ctx.arc(Math.cos(ang)*size*.62,Math.sin(ang)*size*.57-size*.02,size*.09,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
function scenery(){
 const sky=ctx.createLinearGradient(0,0,0,460);sky.addColorStop(0,'#8ed5ff');sky.addColorStop(.55,'#d7f4ff');sky.addColorStop(1,'#ffe9c9');ctx.fillStyle=sky;ctx.fillRect(0,0,720,460);
 // distant hills
 ctx.fillStyle='#a8dc9b';ctx.beginPath();ctx.moveTo(0,255);ctx.quadraticCurveTo(120,145,250,245);ctx.quadraticCurveTo(390,135,520,240);ctx.quadraticCurveTo(630,165,720,235);ctx.lineTo(720,460);ctx.lineTo(0,460);ctx.fill();
 ctx.fillStyle='#7fc78b';ctx.beginPath();ctx.moveTo(0,300);ctx.quadraticCurveTo(160,205,300,295);ctx.quadraticCurveTo(520,190,720,290);ctx.lineTo(720,460);ctx.lineTo(0,460);ctx.fill();
 // fluffy clouds
 for(let i=0;i<4;i++){let x=(i*210-frame*.18%900+900)%900-70,y=65+(i%2)*55;ctx.fillStyle='#ffffffdd';ctx.beginPath();ctx.arc(x,y,23,0,7);ctx.arc(x+25,y-12,31,0,7);ctx.arc(x+55,y,23,0,7);ctx.fill()}
 // winding golden path
 ctx.fillStyle='#d69b58';ctx.beginPath();ctx.moveTo(260,230);ctx.quadraticCurveTo(305,285,160,460);ctx.lineTo(590,460);ctx.quadraticCurveTo(420,300,460,230);ctx.closePath();ctx.fill();
 ctx.fillStyle='#edbd78';ctx.beginPath();ctx.moveTo(305,235);ctx.quadraticCurveTo(335,315,235,460);ctx.lineTo(510,460);ctx.quadraticCurveTo(390,315,420,235);ctx.closePath();ctx.fill();
 // grass verges
 ctx.fillStyle='#69b96d';ctx.fillRect(0,355,720,105);
 // path over grass in foreground
 ctx.fillStyle='#e8b66f';ctx.beginPath();ctx.moveTo(275,235);ctx.quadraticCurveTo(330,320,170,460);ctx.lineTo(575,460);ctx.quadraticCurveTo(400,320,445,235);ctx.closePath();ctx.fill();
 // fence posts scrolling by
 for(let i=0;i<8;i++){let x=((i*125-frame*1.1)%950+950)%950-100;let y=265+(i%3)*28;ctx.fillStyle='#9a6038';ctx.fillRect(x,y,12,72);ctx.fillStyle='#c88a50';ctx.fillRect(x-5,y+12,28,9);ctx.fillRect(x-5,y+43,28,9)}
 // trees at both sides
 for(let i=0;i<6;i++){let side=i%2===0?0:1;let x=side?650+(i%3)*48:35+(i%3)*42;let y=185+(i%3)*38;let s=1+(i%2)*.22;
 ctx.fillStyle='#98603c';ctx.fillRect(x-9*s,y,18*s,75*s);
 ctx.fillStyle=['#6fbd72','#8dcc79','#f2a9b1'][i%3];ctx.beginPath();ctx.arc(x,y-12*s,39*s,0,7);ctx.arc(x-25*s,y+4*s,28*s,0,7);ctx.arc(x+25*s,y+4*s,28*s,0,7);ctx.fill();
 ctx.fillStyle='#ffffff55';for(let k=0;k<5;k++){ctx.beginPath();ctx.arc(x-20+k*10,y-25+(k%2)*8,4,0,7);ctx.fill()}
 }
 // flowers dotted along the grass
 for(let i=0;i<34;i++){let x=(i*83+frame*.55)%740-10,y=300+(i*47%150);if(x<245||x>500){ctx.fillStyle=['#ff7e9b','#ffe17b','#fff','#b99af4'][i%4];for(let k=0;k<5;k++){let ang=k*Math.PI*2/5;ctx.beginPath();ctx.arc(x+Math.cos(ang)*4,y+Math.sin(ang)*4,3.5,0,7);ctx.fill()}ctx.fillStyle='#e6a84b';ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill()}}
}
function draw(){
 scenery();
 obstacles.forEach(o=>{ctx.save();ctx.fillStyle='#8a512e';ctx.beginPath();ctx.roundRect(o.x,345,o.w+18,38,15);ctx.fill();ctx.fillStyle='#bd8050';ctx.beginPath();ctx.roundRect(o.x+5,349,o.w+8,28,12);ctx.fill();ctx.strokeStyle='#e0b27a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(o.x+12,348);ctx.lineTo(o.x+o.w+6,376);ctx.moveTo(o.x+o.w+4,348);ctx.lineTo(o.x+15,376);ctx.stroke();ctx.restore()});
 gems.forEach((g,i)=>{let col=['#ff79a6','#ffc04f','#71c8ff'][i%3];ctx.save();ctx.translate(g.x,g.y);ctx.shadowColor=col;ctx.shadowBlur=12;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,-15);ctx.quadraticCurveTo(18,-2,12,10);ctx.quadraticCurveTo(0,22,-12,10);ctx.quadraticCurveTo(-18,-2,0,-15);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffffcc';ctx.beginPath();ctx.ellipse(-4,-4,3,6,-.4,0,7);ctx.fill();ctx.restore()});
 drawPet(player.x,player.y,55,selected);
 if(!running){ctx.fillStyle='#36556a';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText(over?'Lovely try!':'Ready, fluffy friend?',360,205);ctx.font='20px system-ui';ctx.fillText(over?'Press Play to try again':'Tap Play to begin',360,242)}
}
function update(){
 if(!running)return;frame++;speed=4+Math.min(score/180,5);player.vy+=.58;player.y+=player.vy;if(player.y>320){player.y=320;player.vy=0;player.onGround=true}
 if(frame%Math.max(58,105-Math.floor(speed*4))===0)obstacles.push({x:740,w:55+Math.random()*24});
 if(frame%105===0)gems.push({x:740,y:270+Math.random()*65});
 obstacles.forEach(o=>o.x-=speed);gems.forEach(g=>g.x-=speed);obstacles=obstacles.filter(o=>o.x>-60);gems=gems.filter(g=>g.x>-20);
 for(const o of obstacles){if(player.x+32>o.x&&player.x-32<o.x+o.w+18&&player.y+35>345){end();break}}
 gems=gems.filter(g=>{if(Math.abs(g.x-player.x)<35&&Math.abs(g.y-player.y)<38){drops++;$('drops').textContent=drops;unlock();return false}return true});
 score++;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;localStorage.jjBest=best}
 draw();requestAnimationFrame(update);
}
function jump(){if(running&&player.onGround){player.vy=-13;player.onGround=false}}
function start(){score=0;frame=0;speed=4;obstacles=[];gems=[];player.y=320;player.vy=0;running=true;over=false;$('score').textContent='0';$('message').textContent='Go, fluffy friend!';$('play').textContent='↻ Restart';draw();requestAnimationFrame(update)}
function end(){running=false;over=true;$('message').textContent='You collected '+drops+' jelly drops. Great jumping!';$('play').textContent='↻ Play again';draw()}
function unlock(){for(const p of pets){if(!unlocked.has(p.id)&&drops>=p.cost){unlocked.add(p.id);$('message').textContent='New friend discovered: '+p.name+'! ✨';renderBook();break}}}
function renderBook(){$('cards').innerHTML='';pets.forEach(p=>{let el=document.createElement('div');el.className='pet'+(unlocked.has(p.id)?'':' locked');el.innerHTML='<div class="emoji">'+(unlocked.has(p.id)?p.emoji:'❔')+'</div><b>'+(unlocked.has(p.id)?p.name:'Mystery friend')+'</b><div class="small">'+(unlocked.has(p.id)?'Discovered!':p.cost+' jelly drops')+'</div>';el.onclick=()=>{if(unlocked.has(p.id)){selected=p.id;$('message').textContent=p.name+' is ready to jump!';draw()}};$('cards').appendChild(el)})}
$('play').onclick=start;$('jump').onclick=jump;canvas.addEventListener('pointerdown',()=>{if(running)jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!running)start();else jump()}});
document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{selected=b.dataset.pet;$('message').textContent='You chose '+b.textContent+'!';draw()});
$('collection').onclick=()=>{let b=$('book');b.style.display=b.style.display==='block'?'none':'block';renderBook()};
renderBook();draw();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
