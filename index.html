<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#9cefe6">
<meta name="description" content="A fluffy little 3D jumping adventure.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>JellyJump 3D</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:#9bdfff;color:#75451f}.app{position:fixed;inset:0;overflow:hidden}#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none}.stats{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.stats span{padding:8px 16px;border:3px solid white;border-radius:22px;background:#fff1e7eF;box-shadow:0 4px 0 #bd8e5b66;font-weight:900;font-size:clamp(15px,2vw,23px);white-space:nowrap}button{font-family:inherit;font-weight:900;cursor:pointer;pointer-events:auto}#pause,#friendsTop{position:absolute;top:15px;width:58px;height:58px;border:4px solid white;border-radius:20px;background:linear-gradient(#ffb1b9,#f16f85);color:white;font-size:24px;box-shadow:0 5px 0 #b94e65}#pause{left:16px}#friendsTop{right:16px;background:linear-gradient(#ffe9bb,#ffbd85);color:#9a4c48}#friendsTop small{display:block;font-size:10px}#message{position:absolute;top:17%;left:50%;transform:translateX(-50%);width:90%;text-align:center;font-size:clamp(18px,3vw,28px);font-weight:1000;color:#75451f;text-shadow:0 2px 5px white}.bottom{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:center;align-items:end;gap:12px;padding:0 14px}#play{min-width:170px;padding:15px 26px;border:5px solid white;border-radius:26px;background:linear-gradient(#ff9eaf,#ef6681);color:white;font-size:clamp(21px,3vw,30px);box-shadow:0 7px 0 #b64f67}#choices{position:absolute;left:14px;bottom:15px;display:flex;gap:6px;flex-wrap:wrap;max-width:38vw}#choices button{min-width:67px;padding:7px 9px;border:3px solid white;border-radius:17px;background:#fff5dfed;color:#75451f;box-shadow:0 4px 0 #c4935d;font-size:13px}#choices button.active{background:#c9f2d2;outline:3px solid #fff}#choices button b{display:block;font-size:22px}.book{display:none;position:absolute;z-index:5;left:5%;right:5%;top:13%;max-height:72%;overflow:auto;padding:15px;background:#fff8eaf5;border:3px solid white;border-radius:24px;pointer-events:auto}.book h2{text-align:center;margin:4px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pet{background:white;border-radius:14px;padding:10px;text-align:center;border:2px solid #f5dfc4;cursor:pointer}.pet .emoji{font-size:30px}.locked{filter:grayscale(1);opacity:.5}.hint{position:absolute;bottom:93px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 4px #41677a;white-space:nowrap}.progress{position:absolute;right:16px;bottom:18px;width:min(210px,23vw);padding:10px 12px;border:3px solid white;border-radius:19px;background:#fff8e9ed;text-align:center;font-size:13px;font-weight:900}.bar{height:10px;margin-top:6px;border-radius:20px;background:#e9d2ad;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#7bcf61,#49a94d)}@media(max-width:650px){#pause,#friendsTop{width:47px;height:47px;top:8px;left:8px;border-radius:15px}#friendsTop{left:auto;right:8px}.stats{top:8px;gap:4px}.stats span{padding:6px 9px;font-size:14px}#choices{left:5px;bottom:8px;max-width:43vw;gap:3px}#choices button{min-width:49px;padding:4px;font-size:10px}#choices button b{font-size:18px}#play{min-width:112px;padding:11px;font-size:20px}.bottom{bottom:8px}.progress{right:5px;bottom:8px;width:25vw;padding:6px;font-size:10px}.hint{bottom:65px;font-size:11px}}
</style>
</head>
<body><main class="app">
<canvas id="world" aria-label="JellyJump 3D endless runner"></canvas>
<div class="hud">
<button id="pause" aria-label="Pause">Ⅱ</button><button id="friendsTop">📖<small>Friends</small></button>
<div class="stats"><span>⭐ <b id="score">0</b></span><span>💧 <b id="drops">0</b></span><span>🏆 <b id="best">0</b></span></div>
<div id="message">Choose a fluffy friend and tap Play!</div>
<div class="hint">← → change lanes · Space / ↑ jump · Swipe on mobile</div>
<div class="bottom"><button id="play">▶ Play</button></div>
<div id="choices">
<button data-pet="bunny" class="active"><b>🐰</b>Bunny</button><button data-pet="kitten"><b>🐱</b>Kitten</button><button data-pet="frog"><b>🐸</b>Frog</button><button data-pet="bear"><b>🐻</b>Bear</button>
</div>
<div class="progress">✨ Friend discoveries<div id="goalCount">0 / 100</div><div class="bar"><div class="fill" id="goalFill"></div></div></div>
<div class="book" id="book"><h2>✨ Friend book</h2><p style="text-align:center">Collect jelly drops to discover new friends!</p><div class="cards" id="cards"></div></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const canvas=document.getElementById('world'),$=id=>document.getElementById(id);
if(!window.THREE){$('message').textContent='Please check your internet connection to load the 3D world.';return}
const THREE=window.THREE;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#91d9ff');scene.fog=new THREE.Fog('#c8efff',28,90);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,130);camera.position.set(0,5.8,10.5);camera.lookAt(0,1,-5);
scene.add(new THREE.HemisphereLight(0xffffff,0x8bbd8a,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-5,12,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat('#79ca83'),path=mat('#e9bd7d'),edge=mat('#fff0c9'),wood=mat('#a96e42'),leafMats=['#72c77b','#8bd17f','#f3a9b5'].map(c=>mat(c)),white=mat('#fff7e8'),dark=mat('#394b5b'),pink=mat('#f4b5c7');
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,150),grass);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.18,-35);ground.receiveShadow=true;scene.add(ground);
const track=new THREE.Mesh(new THREE.PlaneGeometry(8,150),path);track.rotation.x=-Math.PI/2;track.position.set(0,-.12,-35);track.receiveShadow=true;scene.add(track);
for(let x of [-4.15,4.15]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.18,.13,150),edge);rail.position.set(x,-.04,-35);scene.add(rail)}
// Soft distant hills
for(let i=0;i<10;i++){const hill=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),mat(i%2?'#a8df9a':'#b8e5a5'));hill.scale.set(7+Math.random()*5,2+Math.random()*2,3);hill.position.set((i%2?1:-1)*(8+Math.random()*5),-.5,-25-i*7);scene.add(hill)}
// Puffy clouds
const clouds=[];for(let i=0;i<9;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),white);puff.scale.set(1.1,.55,.55);puff.position.set((j-1.5)*.8,Math.random()*.35,0);g.add(puff)}g.position.set((Math.random()-.5)*28,7+Math.random()*6,-15-Math.random()*65);g.scale.setScalar(.8+Math.random()*.7);scene.add(g);clouds.push(g)}
// Trees and flowers form a scrolling enchanted garden
const scenery=[];
function tree(x,z,s){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.17,.25,1.6,8),wood);trunk.position.y=.8;trunk.castShadow=true;g.add(trunk);for(let k=0;k<4;k++){const crown=new THREE.Mesh(new THREE.SphereGeometry(.85-k*.08,14,12),leafMats[(k+Math.floor(Math.random()*3))%3]);crown.position.set((k%2-.5)*.55,1.7+Math.floor(k/2)*.55,0);crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);scenery.push(g)}
for(let i=0;i<30;i++){const z=-i*4-3;tree(-6-Math.random()*2,z,.8+Math.random()*.6);tree(6+Math.random()*2,z,.8+Math.random()*.6)}
const flowerMats=['#ff7e9b','#ffe17b','#fff','#b99af4'].map(c=>mat(c));
for(let i=0;i<70;i++){const g=new THREE.Group();for(let k=0;k<5;k++){const petal=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),flowerMats[i%4]);petal.position.set(Math.cos(k*Math.PI*2/5)*.13,.32,Math.sin(k*Math.PI*2/5)*.13);g.add(petal)}const centre=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),mat('#f3b64e'));centre.position.y=.34;g.add(centre);g.position.set((Math.random()>.5?1:-1)*(4.8+Math.random()*3),0,-Math.random()*100);scene.add(g);scenery.push(g)}
const pets=[{id:'bunny',name:'Bunny',emoji:'🐰',color:'#fff0d8',cost:0},{id:'kitten',name:'Kitten',emoji:'🐱',color:'#d9dce8',cost:0},{id:'frog',name:'Frog',emoji:'🐸',color:'#8ed46d',cost:0},{id:'bear',name:'Bear',emoji:'🐻',color:'#b98153',cost:0},{id:'fox',name:'Fox',emoji:'🦊',color:'#f6a05b',cost:8},{id:'lamb',name:'Lamb',emoji:'🐑',color:'#fff8ec',cost:16},{id:'axolotl',name:'Axolotl',emoji:'🩷',color:'#f5a9c6',cost:25},{id:'penguin',name:'Penguin',emoji:'🐧',color:'#8abbdc',cost:36},{id:'dragon',name:'Dragon',emoji:'🐲',color:'#9b91df',cost:50},{id:'unicorn',name:'Unicorn',emoji:'🦄',color:'#e8b4e4',cost:70}];
let selected='bunny',unlocked=new Set(['bunny','kitten','frog','bear']),running=false,paused=false,over=false,score=0,drops=0,best=Number(localStorage.jjBest||0),speed=17,lane=0,targetLane=0,vy=0,onGround=true,jumpTime=0,spawnClock=0,gemClock=0,objects=[],clock=new THREE.Clock();
$('best').textContent=best;
function makePet(id){
const p=pets.find(v=>v.id===id)||pets[0],g=new THREE.Group();
const fur=new THREE.MeshStandardMaterial({color:p.color,roughness:1}),g=new THREE.Group();
const cream=mat('#fff5e7'),dark=mat('#39404d'),pink=mat('#f2a9bd'),paw=mat(p.color);
function ball(name,x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),m);o.name=name;o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;g.add(o);return o}
function ear(x,y,z,sx,sy,sz,m=fur){return ball('ear',x,y,z,sx,sy,sz,m)}
// Soft toy proportions: a plump little body, oversized head and stubby paws.
ball('plush body',0,.78,0,.53,.62,.43,fur);
ball('big plush head',0,1.55,0,.68,.62,.59,fur);
for(let s of [-1,1]){
 ball('arm',s*.53,.91,.02,.22,.39,.23,fur);
 ball('paw',s*.56,.62,.08,.22,.19,.22,paw);
 ball('foot',s*.32,.2,.13,.27,.17,.31,fur);
 ball('paw pad',s*.32,.105,.34,.12,.035,.08,pink);
}
// Fuzzy little tufts on the back and crown catch the light as the friend runs.
for(let i=0;i<13;i++){
 const a=(i/13)*Math.PI*2, x=Math.cos(a)*.48, y=1.53+Math.sin(a)*.43;
 ball('head fluff',x,y,-.43,.105,.12,.09,fur);
}
for(let i=0;i<8;i++){
 const a=(i/8)*Math.PI*2;
 ball('body fluff',Math.cos(a)*.39,.78+Math.sin(a)*.39,-.29,.10,.12,.09,fur);
}
if(id==='bunny'){
 for(let s of [-1,1]){ear(s*.29,2.28,-.02,.18,.48,.15);ear(s*.29,2.28,.105,.09,.34,.035,pink)}
 ball('cotton tail',0,.73,-.48,.24,.24,.22,cream);
}else if(id==='kitten'){
 for(let s of [-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.25,.5,5),fur);e.position.set(s*.43,2.02,0);e.rotation.z=s*-.18;e.castShadow=true;g.add(e);ear(s*.43,2.02,.11,.12,.24,.035,pink)}
 const tail=new THREE.Mesh(new THREE.TorusGeometry(.29,.105,10,20,Math.PI*1.6),fur);tail.position.set(.28,.88,-.45);tail.rotation.set(Math.PI/2,0,-.4);g.add(tail);
}else if(id==='frog'){
 for(let s of [-1,1]){ball('eye bump',s*.36,2.03,0,.22,.23,.22,fur);ball('eye white',s*.36,2.05,.15,.15,.16,.11,cream);ball('pupil',s*.36,2.05,.245,.065,.085,.035,dark)}
 ball('tiny smile',0,1.32,.56,.16,.035,.025,dark);
}else if(id==='bear'){
 for(let s of [-1,1]){ear(s*.5,1.99,0,.23,.23,.17);ear(s*.5,1.99,.12,.12,.12,.045,pink)}
 ball('round tail',0,.72,-.46,.19,.19,.17,fur);
}else if(id==='fox'){
 for(let s of [-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.23,.52,5),fur);e.position.set(s*.42,2.04,0);g.add(e)}
 ball('fluffy tail',.43,.75,-.55,.27,.3,.34,cream);
}else if(id==='lamb'){
 for(let i=0;i<9;i++)ball('wool curl',Math.cos(i*.7)*.47,1.58+Math.sin(i*.7)*.35,-.18,.19,.2,.17,cream);
 ball('wool tail',0,.73,-.47,.2,.2,.2,cream);
}else if(id==='axolotl'){
 for(let s of [-1,1])for(let j=0;j<3;j++)ball('gill',s*(.57+j*.08),1.68+(j-1)*.12,-.02,.11,.13,.1,pink);
 ball('tail fin',0,.8,-.62,.22,.35,.12,pink);
}else if(id==='penguin'){
 ball('back patch',0,.93,-.43,.37,.48,.035,dark);
 ball('belly',0,.83,.39,.4,.5,.14,cream);
}else if(id==='dragon'){
 for(let s of [-1,1]){const h=new THREE.Mesh(new THREE.ConeGeometry(.14,.42,8),mat('#79c987'));h.position.set(s*.38,2.1,0);g.add(h)}
 ball('little tail',0,.66,-.57,.13,.16,.36,fur);
}else if(id==='unicorn'){
 const h=new THREE.Mesh(new THREE.ConeGeometry(.11,.48,8),mat('#ffd36e'));h.position.set(0,2.18,.1);h.rotation.x=-.2;g.add(h);
 for(let i=0;i<3;i++)ball('mane',-.18+i*.18,1.96,-.12,.12,.23,.13,mat(['#f4a9c8','#a9dff2','#d2b1f2'][i]));
 ball('tail',0,.7,-.55,.17,.19,.32,mat('#d9b6ec'));
}
// Face details are kept on the front of each plush friend.
if(id!=='frog'){for(let s of [-1,1]){ball('eye',s*.25,1.65,.52,.07,.095,.045,dark);ball('eye shine',s*.27,1.69,.56,.025,.03,.018,cream)}}
ball('muzzle',0,1.36,.52,.3,.2,.14,cream);
ball('nose',0,1.42,.655,.075,.055,.04,pink);
for(let s of [-1,1])ball('cheek',s*.4,1.35,.47,.12,.075,.035,pink);
g.userData.feet=g.children.filter(o=>o.name==='foot');return g
}
let player=makePet(selected);player.rotation.y=Math.PI;player.position.set(0,0,3);scene.add(player);
function changePet(id){selected=id;scene.remove(player);player=makePet(id);player.rotation.y=Math.PI;player.position.set(lane*2,0,3);scene.add(player);document.querySelectorAll('[data-pet]').forEach(b=>b.classList.toggle('active',b.dataset.pet===id));}
function makeObstacle(l,z){const g=new THREE.Group();const log=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,1.55,12),wood);log.rotation.z=Math.PI/2;log.position.y=.43;log.castShadow=true;g.add(log);const cap=mat('#d69a65');for(let s of [-1,1]){const c=new THREE.Mesh(new THREE.CircleGeometry(.32,12),cap);c.rotation.y=s*Math.PI/2;c.position.set(s*.78,.43,0);g.add(c)}g.position.set(l*2,0,z);scene.add(g);objects.push({group:g,type:'obstacle',lane:l,hit:false})}
function makeGem(l,z){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.43,1),mat('#ff76a8',.25));m.position.set(l*2,1.2,z);m.castShadow=true;scene.add(m);objects.push({group:m,type:'gem',lane:l,hit:false})}
function spawn(){const l=Math.floor(Math.random()*3)-1;makeObstacle(l,-58-Math.random()*8);if(Math.random()<.8)makeGem(Math.floor(Math.random()*3)-1,-68)}
function setLane(n){targetLane=Math.max(-1,Math.min(1,targetLane+n))}
function jump(){if(running&&onGround){vy=9.5;onGround=false;jumpTime=0}}
function move(e){if(e.code==='ArrowLeft'||e.code==='KeyA'){setLane(-1)}else if(e.code==='ArrowRight'||e.code==='KeyD'){setLane(1)}else if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!running&&!over)start();else jump()}}
document.addEventListener('keydown',move);
let touchX=0,touchY=0;canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;touchY=e.clientY});canvas.addEventListener('pointerup',e=>{if(!running)return;const dx=e.clientX-touchX,dy=e.clientY-touchY;if(Math.abs(dx)>25){setLane(dx>0?1:-1)}else if(dy<-20||Math.abs(dx)<20){jump()}});
function renderBook(){$('cards').innerHTML='';pets.forEach(p=>{const el=document.createElement('div');el.className='pet'+(unlocked.has(p.id)?'':' locked');el.innerHTML='<div class="emoji">'+(unlocked.has(p.id)?p.emoji:'❔')+'</div><b>'+(unlocked.has(p.id)?p.name:'Mystery friend')+'</b><div>'+(unlocked.has(p.id)?'Tap to choose':p.cost+' jelly drops')+'</div>';el.onclick=()=>{if(unlocked.has(p.id)){changePet(p.id);$('book').style.display='none';$('message').textContent=p.name+' is ready to run! ✨'}};$('cards').appendChild(el)})}
function unlock(){for(const p of pets){if(!unlocked.has(p.id)&&drops>=p.cost){unlocked.add(p.id);$('message').textContent='New friend discovered: '+p.name+'! ✨';renderBook();break}}}
function clearObjects(){objects.forEach(o=>scene.remove(o.group));objects=[]}
function start(){clearObjects();score=0;lane=0;targetLane=0;vy=0;onGround=true;speed=17;spawnClock=0;gemClock=0;running=true;paused=false;over=false;$('score').textContent='0';$('play').textContent='Ⅱ Pause';$('message').textContent='Go, fluffy friend!';player.position.set(0,0,3);clock.getDelta()}
function end(){running=false;over=true;$('play').textContent='↻ Play again';$('message').textContent='Lovely run! You collected '+drops+' jelly drops!';}
function update(dt){if(!running)return;score+=Math.round(dt*30);$('score').textContent=score;speed=Math.min(29,17+score*.004);spawnClock+=dt;gemClock+=dt;if(spawnClock>Math.max(.8,1.55-score*.0005)){spawn();spawnClock=0}
lane+=(targetLane-lane)*Math.min(1,dt*12);player.position.x=lane*2;player.position.y=Math.max(0,player.position.y+vy*dt);if(!onGround){vy-=23*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}}player.rotation.z+=(lane*-.08-player.rotation.z)*dt*7;
const t=clock.elapsedTime;player.userData.feet.forEach((f,i)=>{f.position.z=Math.sin(t*13+i*Math.PI)*.12;f.position.y=.22+Math.max(0,Math.sin(t*13+i*Math.PI))*.09});
for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.group.position.z+=speed*dt;if(o.type==='gem'){o.group.rotation.y+=dt*2.7;o.group.rotation.z+=dt*1.2}
if(!o.hit&&Math.abs(o.group.position.z-3)<.85&&o.lane===Math.round(lane)){o.hit=true;if(o.type==='gem'){drops++;$('drops').textContent=drops;$('goalCount').textContent=(drops%100)+' / 100';$('goalFill').style.width=(drops%100)+'%';scene.remove(o.group);objects.splice(i,1);unlock();continue}else if(player.position.y<.85){end();break}}
if(o.group.position.z>12){scene.remove(o.group);objects.splice(i,1)}}
scenery.forEach(o=>{o.position.z+=speed*dt;if(o.position.z>12)o.position.z=-100-Math.random()*25});clouds.forEach(c=>{c.position.x+=dt*.35;if(c.position.x>19)c.position.x=-19});
camera.position.x+=(lane*.38-camera.position.x)*dt*2;camera.lookAt(lane*.3,1.2,-5)}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(running)update(dt);renderer.render(scene,camera)}loop();
$('play').onclick=()=>{if(running){running=false;$('play').textContent='▶ Resume';$('message').textContent='Paused!';}else start()};
$('pause').onclick=()=>{if(running){running=false;$('play').textContent='▶ Resume';$('message').textContent='Paused!'}else if(!over)start()};
$('friendsTop').onclick=()=>{$('book').style.display=$('book').style.display==='block'?'none':'block';renderBook()};
document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{changePet(b.dataset.pet);$('message').textContent='You chose '+b.textContent.trim()+'!'});
$('drops').textContent=drops;renderBook();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
