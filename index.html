<script>
(()=>{
const canvas=document.getElementById('world'),$=id=>document.getElementById(id);
if(!window.THREE){$('message').textContent='Please check your internet connection to load the 3D world.';return}
const THREE=window.THREE;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#91d9ff');scene.fog=new THREE.Fog('#c8efff',28,90);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,130);camera.position.set(0,5.8,10.5);camera.lookAt(0,1,-5);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat('#79ca83'),path=mat('#e9bd7d'),edge=mat('#fff0c9'),wood=mat('#a96e42'),leafMats=['#72c77b','#8bd17f','#f3a9b5'].map(c=>mat(c)),white=mat('#fff7e8'),dark=mat('#394b5b'),pink=mat('#f4b5c7');
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,150),grass);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.18,-35);ground.receiveShadow=true;scene.add(ground);
const track=new THREE.Mesh(new THREE.PlaneGeometry(8,150),path);track.rotation.x=-Math.PI/2;track.position.set(0,-.12,-35);track.receiveShadow=true;scene.add(track);
for(let x of [-4.15,4.15]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.18,.13,150),edge);rail.position.set(x,-.04,-35);scene.add(rail)}
// Soft distant hills
for(let i=0;i<10;i++){const hill=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),mat(i%2?'#a8df9a':'#b8e5a5'));hill.scale.set(7+Math.random()*5,2+Math.random()*2,3);hill.position.set((i%2?1:-1)*(8+Math.random()*5),-.5,-25-i*7);scene.add(hill)}
// Puffy clouds
const clouds=[];for(let i=0;i<9;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),white);puff.scale.set(1.1,.55,.55);puff.position.set((j-1.5)*.8,Math.random()*.35,0);g.add(puff)}g.position.set((Math.random()-.5)*28,7+Math.random()*6,-15-Math.random()*65);g.scale.setScalar(.8+Math.random()*.7);scene.add(g);clouds.push(g)}
// Trees and flowers form a scrolling enchanted garden
const scenery=[];
function tree(x,z,s){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.17,.25,1.6,8),wood);trunk.position.y=.8;trunk.castShadow=true;g.add(trunk);for(let k=0;k<4;k++){const crown=new THREE.Mesh(new THREE.SphereGeometry(.85-k*.08,14,12),leafMats[(k+Math.floor(Math.random()*3))%3]);crown.position.set((k%2-.5)*.55,1.7+Math.floor(k/2)*.55,0);crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);scenery.push(g)}
for(let i=0;i<30;i++){const z=-i*4-3;tree(-6-Math.random()*2,z,.8+Math.random()*.6);tree(6+Math.random()*2,z,.8+Math.random()*.6)}
const flowerMats=['#ff7e9b','#ffe17b','#fff','#b99af4'].map(c=>mat(c));
for(let i=0;i<70;i++){const g=new THREE.Group();for(let k=0;k<5;k++){const petal=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),flowerMats[i%4]);petal.position.set(Math.cos(k*Math.PI*2/5)*.13,.32,Math.sin(k*Math.PI*2/5)*.13);g.add(petal)}const centre=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),mat('#f3b64e'));centre.position.y=.34;g.add(centre);g.position.set((Math.random()>.5?1:-1)*(4.8+Math.random()*3),0,-Math.random()*100);scene.add(g);scenery.push(g)}
const pets=[{id:'bunny',name:'Bunny',emoji:'🐰',color:'#fff0d8',cost:0},{id:'kitten',name:'Kitten',emoji:'🐱',color:'#d9dce8',cost:0},{id:'frog',name:'Frog',emoji:'🐸',color:'#8ed46d',cost:0},{id:'bear',name:'Bear',emoji:'🐻',color:'#b98153',cost:0},{id:'fox',name:'Fox',emoji:'🦊',color:'#f6a05b',cost:8},{id:'lamb',name:'Lamb',emoji:'🐑',color:'#fff8ec',cost:16},{id:'axolotl',name:'Axolotl',emoji:'🩷',color:'#f5a9c6',cost:25},{id:'penguin',name:'Penguin',emoji:'🐧',color:'#8abbdc',cost:36},{id:'dragon',name:'Dragon',emoji:'🐲',color:'#9b91df',cost:50},{id:'unicorn',name:'Unicorn',emoji:'🦄',color:'#e8b4e4',cost:70}];
let selected='bunny',unlocked=new Set(['bunny','kitten','frog','bear']),running=false,paused=false,over=false,score=0,drops=0,best=Number(localStorage.jjBest||0),speed=17,lane=0,targetLane=0,vy=0,onGround=true,jumpTime=0,slideTimer=0,spawnClock=0,gemClock=0,objects=[],clock=new THREE.Clock();
// Cute original audio made with Web Audio: no downloads or external music files.
let audioCtx=null,muted=false,musicTimer=null,musicStep=0;
// Original 8-bar JellyJump soundtrack: a little pop/adventure tune with melody, chords, bass and a light beat.
const melody=[72,76,79,76,74,76,79,83,81,79,76,74,72,74,76,79, 76,79,84,79,76,79,81,84,83,81,79,76,74,76,79,81, 81,84,88,84,83,81,79,76,81,79,76,74,72,74,76,79, 77,81,84,81,79,77,76,72,74,76,77,79,76,74,72];
const chords=[[48,52,55],[43,47,50],[45,48,52],[41,45,48],[48,52,55],[43,47,50],[45,48,52],[41,45,48]];
const bass=[36,31,33,29,36,31,33,29];
function audioReady(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,duration=.12,wave='sine',volume=.045,delay=0){if(muted)return;audioReady();if(!audioCtx)return;const now=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.025)}
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function effect(kind){if(muted)return;if(kind==='jump'){tone(420,.12,'sine',.055);tone(620,.16,'sine',.04,.07)}else if(kind==='gem'){tone(880,.09,'sine',.05);tone(1174.66,.13,'sine',.045,.07)}else if(kind==='unlock'){[523.25,659.25,783.99,1046.5].forEach((n,i)=>tone(n,.22,'triangle',.055,i*.12))}else if(kind==='end'){[392,329.63,261.63].forEach((n,i)=>tone(n,.22,'triangle',.05,i*.16))}}
function musicTick(){
 if(!running||muted)return;
 const step=musicStep%64,bar=Math.floor(step/8),beat=step%8,delay=0;
 const note=melody[step];
 if(note!==null)tone(midi(note),.22,'triangle',.016,delay);
 if(beat===0){
  chords[bar].forEach((n,i)=>tone(midi(n+12),.82,'sine',.006,i*.012));
  tone(midi(bass[bar]),.42,'sine',.025);
  tone(115,.12,'sine',.022);
 }else if(beat===4){
  tone(midi(bass[bar]+12),.3,'sine',.018);
  tone(95,.1,'sine',.016);
 }else if(beat===2||beat===6){
  tone(185,.075,'triangle',.012);
  tone(1200,.035,'square',.003);
 }
 if(beat%2===0)tone(4200,.025,'sine',.0025);
 musicStep++;
}
function startMusic(){if(muted||musicTimer)return;audioReady();musicStep=0;musicTick();musicTimer=setInterval(musicTick,278)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function refreshSoundButton(){$('sound').textContent=muted?'🔇':'🔊';$('sound').setAttribute('aria-label',muted?'Turn sound on':'Mute sound')}

$('best').textContent=best;
function makePet(id){
const p=pets.find(v=>v.id===id)||pets[0],fur=new THREE.MeshStandardMaterial({color:p.color,roughness:1,metalness:0}),g=new THREE.Group();
const cream=mat('#fff5e7'),dark=mat('#39404d'),pink=mat('#f2a9bd'),paw=mat(p.color);
function ball(name,x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),m);o.name=name;o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;g.add(o);return o}

ball('big plush head',0,1.59,0,.77,.72,.68,fur);
for(let s of [-1,1]){
 ball('soft shoulder',s*.48,1.12,.015,.29,.34,.3,fur);

 ball('paw',s*.65,.59,.08,.25,.22,.24,fur);

 ball('paw pad',s*.34,.075,.39,.13,.035,.075,pink);
}
// A subtle stitched back seam makes the friend read as a sewn plush toy.
const thread=new THREE.MeshStandardMaterial({color:new THREE.Color(p.color).multiplyScalar(.78),roughness:1});
const backSeam=new THREE.CatmullRomCurve3([
 new THREE.Vector3(0,1.98,-.48),new THREE.Vector3(0,1.72,-.675),
 new THREE.Vector3(0,1.38,-.665),new THREE.Vector3(0,1.08,-.55),
 new THREE.Vector3(0,.76,-.49),new THREE.Vector3(0,.42,-.38)
]);
const seam=new THREE.Mesh(new THREE.TubeGeometry(backSeam,28,.012,5,false),thread);seam.name='tiny plush seam';g.add(seam);
if(id==='bunny'){
 // Long upright rabbit ears and a round cotton tail are clear from the chase camera.

  const e=ear(s*.29,2.28,-.04,.18,.5,.15);

 }

 ball('rabbit haunch',0,.43,-.22,.48,.37,.28,fur);
}else if(id==='kitten'){
 for(let s of [-1,1]){
  const e=new THREE.Mesh(new THREE.ConeGeometry(.25,.55,5),fur);
  e.position.set(s*.43,2.02,-.04);e.rotation.z=s*-.18;e.castShadow=true;g.add(e);

}else if(id==='frog'){

}else if(id==='bear'){

 for(let i=0;i<5;i++){
  const mane=ball('rainbow unicorn mane',-.3+i*.15,1.96,-.28,.12,.27,.16,mat(['#f4a9c8','#a9dff2','#d2b1f2','#ffe18b','#a8dca8'][i]));
  mane.rotation.z=(i-2)*.12;
 }
 for(let i=0;i<3;i++)ball('rainbow unicorn tail',-.1+i*.1,.72,-.78,.11,.2,.28,mat(['#f4a9c8','#a9dff2','#d2b1f2'][i]));
}
// Face details are kept on the front of each plush friend.
if(id!=='frog'){for(let s of [-1,1]){ball('eye',s*.25,1.65,.52,.07,.095,.045,dark);ball('eye shine',s*.27,1.69,.56,.025,.03,.018,cream)}}
ball('muzzle',0,1.36,.52,.3,.2,.14,cream);
ball('nose',0,1.42,.655,.075,.055,.04,pink);
for(let s of [-1,1])ball('cheek',s*.4,1.35,.47,.12,.075,.035,pink);
g.userData.feet=g.children.filter(o=>o.name==='foot');return g
}
let player=makePet(selected);player.rotation.y=Math.PI;player.position.set(0,0,3);scene.add(player);
function changePet(id){selected=id;scene.remove(player);player=makePet(id);player.rotation.y=Math.PI;player.position.set(lane*2,0,3);scene.add(player);document.querySelectorAll('[data-pet]').forEach(b=>b.classList.toggle('active',b.dataset.pet===id));}
function makeObstacle(l,z,kind='log'){
 const g=new THREE.Group();
 if(kind==='log'){
  const log=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,1.55,12),wood);log.rotation.z=Math.PI/2;log.position.y=.43;log.castShadow=true;g.add(log);
  const cap=mat('#d69a65');for(let s of [-1,1]){const c=new THREE.Mesh(new THREE.CircleGeometry(.32,12),cap);c.rotation.y=s*Math.PI/2;c.position.set(s*.78,.43,0);g.add(c)}
 }else if(kind==='barrier'){
  const beam=new THREE.Mesh(new THREE.BoxGeometry(1.75,.28,.32),mat('#b97848'));beam.position.y=2.02;beam.castShadow=true;g.add(beam);
  for(let s of [-1,1]){const post=new THREE.Mesh(new THREE.BoxGeometry(.16,1.95,.2),mat('#d49a65'));post.position.set(s*.76,1.0,0);post.castShadow=true;g.add(post)}
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.35,.055,.34),mat('#ffe19a'));stripe.position.set(0,2.02,.02);g.add(stripe);
 }else if(kind==='rock'){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.82,1),mat('#8c9a9b'));rock.position.y=.72;rock.scale.set(1,.92,.9);rock.rotation.set(.2,.4,.15);rock.castShadow=true;rock.receiveShadow=true;g.add(rock);
  const highlight=new THREE.Mesh(new THREE.DodecahedronGeometry(.28,0),mat('#b9c5bd'));highlight.position.set(-.28,1.18,.48);highlight.scale.set(1,.45,.35);g.add(highlight);
 }
 g.position.set(l*2,0,z);scene.add(g);objects.push({group:g,type:kind,lane:l,hit:false});
}
function makeGem(l,z){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.43,1),mat('#ff76a8',.25));m.position.set(l*2,1.2,z);m.castShadow=true;scene.add(m);objects.push({group:m,type:'gem',lane:l,hit:false})}
function spawn(){const l=Math.floor(Math.random()*3)-1;const kinds=['log','log','barrier','rock'];const kind=kinds[Math.floor(Math.random()*kinds.length)];makeObstacle(l,-58-Math.random()*8,kind);if(Math.random()<.8)makeGem(Math.floor(Math.random()*3)-1,-68)}
function setLane(n){targetLane=Math.max(-1,Math.min(1,targetLane+n))}
function jump(){if(running&&onGround){vy=9.5;onGround=false;jumpTime=0;effect('jump')}}
function slide(){if(running&&onGround&&slideTimer<=0){slideTimer=.78}}
function move(e){if(e.code==='ArrowLeft'||e.code==='KeyA'){setLane(-1)}else if(e.code==='ArrowRight'||e.code==='KeyD'){setLane(1)}else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();slide()}else if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!running&&!over)start();else jump()}}
document.addEventListener('keydown',move);
let touchX=0,touchY=0;canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;touchY=e.clientY});canvas.addEventListener('pointerup',e=>{if(!running)return;const dx=e.clientX-touchX,dy=e.clientY-touchY;if(Math.abs(dx)>14){setLane(dx>0?1:-1)}else if(dy>16){slide()}else if(dy<-16||Math.abs(dx)<14){jump()}});
function renderBook(){$('cards').innerHTML='';pets.forEach(p=>{const el=document.createElement('div');el.className='pet'+(unlocked.has(p.id)?'':' locked');el.innerHTML='<div class="emoji">'+(unlocked.has(p.id)?p.emoji:'❔')+'</div><b>'+(unlocked.has(p.id)?p.name:'Mystery friend')+'</b><div>'+(unlocked.has(p.id)?'Tap to choose':p.cost+' jelly drops')+'</div>';el.onclick=()=>{if(unlocked.has(p.id)){changePet(p.id);$('book').style.display='none';$('message').textContent=p.name+' is ready to run! ✨'}};$('cards').appendChild(el)})}
function unlock(){for(const p of pets){if(!unlocked.has(p.id)&&drops>=p.cost){unlocked.add(p.id);$('message').textContent='New friend discovered: '+p.name+'! ✨';effect('unlock');renderBook();break}}}
function clearObjects(){objects.forEach(o=>scene.remove(o.group));objects=[]}
function start(){clearObjects();score=0;lane=0;targetLane=0;vy=0;onGround=true;slideTimer=0;speed=17;spawnClock=0;gemClock=0;running=true;paused=false;over=false;$('score').textContent='0';$('play').textContent='Ⅱ Pause';$('message').textContent='Go, fluffy friend!';player.position.set(0,0,3);clock.getDelta();audioReady();startMusic()}
function end(){const collectedThisRun=drops;running=false;over=true;stopMusic();effect('end');drops=0;$('drops').textContent='0';$('goalCount').textContent='0 / 100';$('goalFill').style.width='0%';$('play').textContent='↻ Play again';$('message').textContent='Lovely run! You collected '+collectedThisRun+' jelly drops. Your friends are safe! 💛';}
function update(dt){if(!running)return;score+=Math.round(dt*30);$('score').textContent=score;speed=Math.min(29,17+score*.004);spawnClock+=dt;gemClock+=dt;if(spawnClock>Math.max(.8,1.55-score*.0005)){spawn();spawnClock=0}
lane+=(targetLane-lane)*Math.min(1,dt*24);player.position.x=lane*2;player.position.y=Math.max(0,player.position.y+vy*dt);if(!onGround){vy-=23*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}}player.rotation.z+=(lane*-.08-player.rotation.z)*dt*7;
const t=clock.elapsedTime;const bounce=onGround?Math.sin(t*13)*.025:0;if(slideTimer>0)slideTimer=Math.max(0,slideTimer-dt);const ducking=slideTimer>0;const slideBlend=ducking?1:0;player.rotation.x+=(slideBlend*(Math.PI/2)-player.rotation.x)*Math.min(1,dt*18);player.position.y+=( (ducking?.72:bounce)-player.position.y)*Math.min(1,dt*18);player.position.z+=(3-player.position.z)*Math.min(1,dt*18);player.scale.setScalar(.8);player.userData.feet.forEach((f,i)=>{f.position.z=Math.sin(t*13+i*Math.PI)*.025;f.position.y=.22+Math.max(0,Math.sin(t*13+i*Math.PI))*.025});
for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.group.position.z+=speed*dt;if(o.type==='gem'){o.group.rotation.y+=dt*2.7;o.group.rotation.z+=dt*1.2}
if(!o.hit&&Math.abs(o.group.position.z-3)<.85&&o.lane===Math.round(lane)){
 o.hit=true;
 if(o.type==='gem'){drops++;effect('gem');$('drops').textContent=drops;$('goalCount').textContent=(drops%100)+' / 100';$('goalFill').style.width=(drops%100)+'%';scene.remove(o.group);objects.splice(i,1);unlock();continue}
 const collision=(o.type==='log'&&player.position.y<.85)||(o.type==='barrier'&&!ducking)||(o.type==='rock');
 if(collision){end();break}
}
if(o.group.position.z>12){scene.remove(o.group);objects.splice(i,1)}}
scenery.forEach(o=>{o.position.z+=speed*dt;if(o.position.z>12)o.position.z=-100-Math.random()*25});clouds.forEach(c=>{c.position.x+=dt*.35;if(c.position.x>19)c.position.x=-19});
camera.position.x+=(lane*.38-camera.position.x)*dt*2;camera.lookAt(lane*.3,1.2,-5)}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(running)update(dt);renderer.render(scene,camera)}loop();
['leftMove','rightMove'].forEach((id,i)=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(running)setLane(i===0?-1:1);});b.addEventListener('click',e=>e.preventDefault())});
 $('play').onclick=()=>{if(running){running=false;stopMusic();$('play').textContent='▶ Resume';$('message').textContent='Paused!';}else start()};
$('pause').onclick=()=>{if(running){running=false;stopMusic();$('play').textContent='▶ Resume';$('message').textContent='Paused!'}else if(!over)start()};
$('sound').onclick=()=>{muted=!muted;refreshSoundButton();if(muted)stopMusic();else if(running){audioReady();startMusic()}};refreshSoundButton();
$('friendsTop').onclick=()=>{$('book').style.display=$('book').style.display==='block'?'none':'block';renderBook()};
document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{changePet(b.dataset.pet);$('message').textContent='You chose '+b.textContent.trim()+'!'});
$('drops').textContent=drops;renderBook();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
